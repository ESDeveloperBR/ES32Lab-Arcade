[release]

; Nome público da aplicação.
; Pode conter espaços, acentos e caracteres UTF-8.
name = ES32Lab Arcade

; Pessoa, empresa ou organização responsável pela aplicação.
developer = ES Developer

; Versão publicada da aplicação.
; Recomendado utilizar versionamento no formato X.Y.Z.
version = 1.4.1

; Data correspondente à versão.
; Formato obrigatório: AAAA-MM-DD.
version_date = 2026-10-16

; Descrição pública da aplicação.
description = Diversos jogos para sua divesão em sua ES32Lab.

; Imagem de apresentação.
; Opcional. Se ausente, a loja poderá utilizar uma imagem padrão.
thumbnail_url = https://img.magnific.com/vetores-gratis/ilustracao-do-icone-do-vetor-dos-desenhos-animados-do-jogo-da-maquina-da-arcada-icone-de-tecnologia-de-ferias-isolado-premium-flat_138676-7546.jpg

; Vídeo relacionado à aplicação.
; Opcional.
video_url = https://www.youtube.com/watch?v=U_iIK7eju4Y&list=PLpVVewmHgD_LDEXAvsAxDWjS-3XCfZlZi

; Palavras-chave para busca e classificação.
; No platformio.ini são separadas por vírgula.
; No manifest.json o gerador poderá convertê-las para uma matriz JSON.
keywords = ES32Lab, Arcade, jogos, games, ESP32, retro gaming, game console, TFT, WiFi, Tetris, Space Invader, Snake, Minhoquinha, Enduro Lab, Frog Adventure, ES32 Lab Boxe, Rachacuca

; Nome-base dos arquivos binários, SEM a extensão .bin.
;
; Exemplos derivados automaticamente:
bin_name = es32lab_arcade

; Repositório utilizado para publicação.
; Formato esperado para GitHub: ORGANIZACAO/REPOSITORIO
repository = ESDeveloperBR/ES32Lab-Arcade

; Site oficial da aplicação ou desenvolvedor.
; Opcional.
website = https://www.esdeveloper.com.br/

; URL do arquivo manifest.json.
; Opcional. Se ausente, o gerador poderá criar um manifest.json padrão.
manifest_url = https://github.com/ESDeveloperBR/ES32Lab-Arcade/releases/latest/download/manifest.json

; Indica se a aplicação utiliza Wi-Fi.
; Opcional. Se ausente, o gerador poderá assumir que a aplicação não utiliza Wi
uses_wifi = true









[arcade]

; Rede usada enquanto o menu principal estiver aberto.
wifi_ssid = homeF
wifi_password = estouemcasa

; Identificacao e autenticacao do servico OTA.
ota_hostname = es32lab-arcade
ota_password = estouemcasa


[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino

monitor_speed = 115200
;lib_ldf_mode = deep+

; Mantem dois slots de aplicacao para atualizacao OTA e aumenta
; o espaco disponivel para o firmware com varios jogos.
board_build.partitions = min_spiffs.csv

; Disponibiliza versao, Wi-Fi e OTA para o codigo-fonte.
build_flags =
    -DES32LAB_ARCADE_VERSION=\"${release.version}\"
    -DES32LAB_ARCADE_WIFI_SSID=\"${arcade.wifi_ssid}\"
    -DES32LAB_ARCADE_WIFI_PASSWORD=\"${arcade.wifi_password}\"
    -DES32LAB_ARCADE_OTA_HOSTNAME=\"${arcade.ota_hostname}\"
    -DES32LAB_ARCADE_OTA_PASSWORD=\"${arcade.ota_password}\"

;lib_deps =
;    ESDeveloperBR/ES32Lab
;    ESDeveloperBR/TFT_eSPI_ES32Lab


; Depois da primeira gravacao por USB, selecione este ambiente
; para enviar novas versoes pela rede.
[env:nodemcu-32s-ota]
extends = env:nodemcu-32s

upload_protocol = espota
upload_port = ${arcade.ota_hostname}.local

upload_flags =
    --port=3232
    --auth=${arcade.ota_password}
