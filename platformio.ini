[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino

monitor_speed = 115200
lib_ldf_mode = deep+

; Mantem dois slots de aplicacao para atualizacao OTA e aumenta
; o espaco disponivel para o firmware com varios jogos.
board_build.partitions = min_spiffs.csv

lib_deps =
    esdeveloper/ES32Lab
    esdeveloper/TFT_eSPI_ES32Lab


; Depois da primeira gravacao por USB, selecione este ambiente
; para enviar novas versoes pela rede.
[env:nodemcu-32s-ota]
extends = env:nodemcu-32s

upload_protocol = espota
upload_port = es32lab-arcade.local

upload_flags =
    --port=3232
    --auth=estouemcasa
